<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shop Billing">
  <title>SARAF & SAFEES STORES</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icons/app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
  <div class="liquid-bg" aria-hidden="true">
    <div class="liquid-orb liquid-orb--1"></div>
    <div class="liquid-orb liquid-orb--2"></div>
    <div class="liquid-orb liquid-orb--3"></div>
    <div class="liquid-orb liquid-orb--4"></div>
    <div class="liquid-orb liquid-orb--5"></div>
  </div>

  <div class="app-shell">
    <header class="app-header">
      <h1>SARAF & SAFEES STORES</h1>
      <h2>Supermarket Billing App</h2>
      <p>Manage items, build bill, and view daily sales</p>
    </header>

    <main class="layout">
      <section class="panel menu-panel">
        <div class="panel-head">
          <h2>Menu</h2>
          <div class="menu-tools">
            <input id="searchInput" type="text" placeholder="Search items...">
            <select id="categoryFilter">
              <option value="all">All Categories</option>
              <option value="Fruits">Fruits</option>
              <option value="Vegetables">Vegetables</option>
              <option value="Dairy Products">Dairy Products</option>
              <option value="Bakery Items">Bakery Items</option>
              <option value="Grains and Cereals">Grains and Cereals</option>
              <option value="Pulses and Lentils">Pulses and Lentils</option>
              <option value="Cooking Essentials">Cooking Essentials</option>
              <option value="Snacks and Ready-to-Eat Items">Snacks and Ready-to-Eat Items</option>
              <option value="Beverages and Drinks">Beverages and Drinks</option>
              <option value="Frozen and Packaged Foods">Frozen and Packaged Foods</option>
              <option value="Condiments and Sauces">Condiments and Sauces</option>
              <option value="Personal Care Items">Personal Care Items</option>
              <option value="Household and Cleaning Products">Household and Cleaning Products</option>
              <option value="Baby Products">Baby Products</option>
            </select>
          </div>
        </div>
        <div id="menuGrid" class="menu-grid"></div>
      </section>

      <section class="panel cart-panel">
        <h2>Cart & Bill</h2>
        <div id="cartItems" class="cart-items"></div>
        <div class="bill-box">
          <div class="bill-row">
            <span>Subtotal</span>
            <strong id="subtotalValue">0.00</strong>
          </div>
          <div class="bill-row total">
            <span>Total</span>
            <strong id="totalValue">0.00</strong>
          </div>
        </div>
        <div class="actions">
          <button id="payNowBtn" class="primary">Pay Now</button>
          <button id="printBillBtn">Print Bill</button>
          <button id="clearCartBtn" class="danger">Clear Cart</button>
        </div>
        <p id="statusMessage" class="status"></p>
      </section>
    </main>

    <section class="panel admin-panel">
      <h2>Manage Menu (CRUD)</h2>
      <form id="productForm" class="product-form">
        <input type="hidden" id="productId">
        <input id="productName" type="text" placeholder="Item Name" required>
        <select id="productCategory" required>
          <option value="">Select Category</option>
          <option value="Fruits">Fruits</option>
          <option value="Vegetables">Vegetables</option>
          <option value="Dairy Products">Dairy Products</option>
          <option value="Bakery Items">Bakery Items</option>
          <option value="Grains and Cereals">Grains and Cereals</option>
          <option value="Pulses and Lentils">Pulses and Lentils</option>
          <option value="Cooking Essentials">Cooking Essentials</option>
          <option value="Snacks and Ready-to-Eat Items">Snacks and Ready-to-Eat Items</option>
          <option value="Beverages and Drinks">Beverages and Drinks</option>
          <option value="Frozen and Packaged Foods">Frozen and Packaged Foods</option>
          <option value="Condiments and Sauces">Condiments and Sauces</option>
          <option value="Personal Care Items">Personal Care Items</option>
          <option value="Household and Cleaning Products">Household and Cleaning Products</option>
          <option value="Baby Products">Baby Products</option>
        </select>
        <input id="productPrice" type="number" min="1" step="0.01" placeholder="Price" required>
        <input id="productStock" type="number" min="0" step="1" placeholder="Stock" required>
        <input id="productImage" type="url" placeholder="Image URL">
        <button type="submit" class="primary">Save Product</button>
        <button id="resetFormBtn" type="button">Reset</button>
      </form>
      <div id="manageList" class="manage-list"></div>
    </section>

    <section class="panel report-panel">
      <h2>Daily Sales Report</h2>
      <div class="report-stats">
        <div class="report-card">
          <p>Orders Today</p>
          <strong id="ordersToday">0</strong>
        </div>
        <div class="report-card">
          <p>Sales Today</p>
          <strong id="salesToday">0.00</strong>
        </div>
      </div>
      <div id="salesList" class="sales-list"></div>
    </section>
  </div>

  <template id="invoiceTemplate">
    <section class="invoice">
      <h2>Invoice</h2>
      <p id="invoiceDate"></p>
      <div id="invoiceItems"></div>
      <p id="invoiceTotal"></p>
    </section>
  </template>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js");
      });
    }
  </script>
  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
